services:
  pay-gateway:
    image: pay-gateway:latest
    container_name: pay-gateway
    restart: unless-stopped
    env_file: .env
    volumes:
      - ./data:/data
    network_mode: bridge
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:8787/healthz"]
      interval: 30s
      timeout: 5s
      retries: 3
