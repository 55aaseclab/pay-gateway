services:
  pay-gateway:
    image: pay-gateway:latest
    container_name: pay-gateway
    restart: unless-stopped
    env_file: .env
    volumes:
      - ./data:/data
    network_mode: bridge
    healthcheck:
      test: ["CMD-SHELL", "bash -c 'echo > /dev/tcp/127.0.0.1/8787'"]
      interval: 30s
      timeout: 5s
      retries: 3
