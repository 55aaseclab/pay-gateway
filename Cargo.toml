[package]
name = "pay-gateway"
version = "0.1.0"
edition = "2021"
description = "55AA 易支付协议网关：epay(MD5) ↔ 可插拔支付 provider（首个模块：微信 Native v3）"
license = "proprietary"

[dependencies]
axum = "0.8"
tokio = { version = "1", features = ["full"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "json"] }
md-5 = "0.10"
sha2 = "0.10"
rsa = { version = "0.9", features = ["sha2", "pem"] }
aes-gcm = "0.10"
rand = "0.8"
base64 = "0.22"
qrcode = "0.14"
image = { version = "0.25", default-features = false, features = ["png"] }
rusqlite = { version = "0.32", features = ["bundled"] }
chrono = { version = "0.4", features = ["serde"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
async-trait = "0.1"
thiserror = "2"
hex = "0.4"
bytes = "1"
x509-parser = "0.16"

[dev-dependencies]
tempfile = "3"

[profile.release]
lto = true
strip = true
