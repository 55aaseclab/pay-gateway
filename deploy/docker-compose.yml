services:
  pay-gateway:
    image: pay-gateway:latest
    container_name: pay-gateway
    restart: unless-stopped
    env_file: .env
    volumes:
      - ./data:/data
      - ./apiclient_key.pem:/run/secrets/wx-apiclient-key.pem:ro
    ports:
      - "127.0.0.1:8787:8787"
    healthcheck:
      test: ["CMD-SHELL", "bash -c 'echo > /dev/tcp/127.0.0.1/8787'"]
      interval: 30s
      timeout: 5s
      retries: 3
